[project]
name = "qmd-finetune"
version = "0.1.0"
description = "QMD query expansion fine-tuning tools"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.13.0",
  "trl>=0.12.0",
  "peft>=0.7.0",
  "transformers>=5.5.0",
  "accelerate>=0.24.0",
  "huggingface_hub>=0.20.0",
  "trackio>=0.35.0",
  "datasets",
  "pyyaml",
  "gguf",
  "sentencepiece",
  "nvidia-ml-py",
  "pydantic>=2.0",
]

[dependency-groups]
dev = []

[tool.uv]
exclude-newer = "2026-08-18T14:55:00Z"
constraint-dependencies = [
  "authlib>=1.6.9",
  "aiohttp>=3.14.3",
  "cryptography>=46.0.7",
  "gradio>=6.15.1",
  "idna>=3.15",
  "pillow>=12.3.0",
  "python-multipart>=0.0.31",
  "setuptools>=83.0.0",
  "starlette>=1.3.1",
  "urllib3>=2.7.0",
]
