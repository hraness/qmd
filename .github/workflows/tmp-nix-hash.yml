name: temp-nix-hash
on:
  push:
    branches: [tmp/nix-hash-20261005]
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix build --no-link --print-build-logs .#packages.$(nix eval --impure --raw --expr builtins.currentSystem).qmd
