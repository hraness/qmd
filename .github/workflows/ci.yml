name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-node:
    name: Node ${{ matrix.node-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: ["22", "23"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install SQLite (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Install SQLite (macOS)
        if: runner.os == 'macOS'
        run: brew install sqlite

      - run: npm install

      - name: Tests
        run: npx vitest run --reporter=verbose --testTimeout 60000 test/
        env:
          CI: true

  test-bun:
    name: Bun (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install SQLite (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Install SQLite (macOS)
        if: runner.os == 'macOS'
        run: brew install sqlite

      - name: Verify lockfile is up-to-date
        run: bun install --frozen-lockfile

      - name: Tests
        run: bun test --timeout 60000 --preload ./src/test-preload.ts test/
        env:
          CI: true
          DYLD_LIBRARY_PATH: /opt/homebrew/opt/sqlite/lib
          LD_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu

  build-flake:
    name: Nix
    uses: ./.github/workflows/nix.yml

  required:
    name: Required
    if: always()
    needs: [test-node, test-bun, build-flake]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job
        env:
          TEST_NODE: ${{ needs.test-node.result }}
          TEST_BUN: ${{ needs.test-bun.result }}
          BUILD_FLAKE: ${{ needs.build-flake.result }}
        run: |
          set -euo pipefail
          [[ "$TEST_NODE" == success ]]
          [[ "$TEST_BUN" == success ]]
          [[ "$BUILD_FLAKE" == success ]]
